<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Page not found · El Jardín de los Ángeles</title>
<link rel="icon" type="image/png" href="/img/favicon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Karla:wght@400;500;700&display=swap">
<style>
:root{--ink:#1E2333;--muted:#4F5566;--accent:#2F4A7A;--gold:#F2D48A}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:Karla,"Helvetica Neue",Helvetica,Arial,sans-serif;color:#FBF7EE;background:#1C2440;display:flex;align-items:center;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 24px max(24px,env(safe-area-inset-bottom,0px));position:relative;overflow-x:hidden}
.bg{position:fixed;inset:0;background:url(/img/cascada.jpg) center/cover no-repeat}
.bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,24,46,.55),rgba(18,24,46,.88))}
main{position:relative;max-width:560px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:20px}
.logo{width:88px;height:88px;border-radius:20px;box-shadow:0 12px 30px rgba(0,0,0,.35)}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--gold)}
h1{font-family:Fraunces,Georgia,serif;font-weight:400;font-size:clamp(34px,7vw,52px);line-height:1.1;margin:0;color:#fff}
p{margin:0;font-size:18px;line-height:1.6;color:#E9E4D8}
.ctas{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:8px}
.btn{min-height:52px;padding:0 26px;display:inline-flex;align-items:center;justify-content:center;border-radius:999px;font-weight:700;font-size:16px;text-decoration:none}
.btn-light{background:#F4F0E8;color:var(--ink)}
.btn-ghost{border:1px solid #F4F0E8;color:#fff}
.lang{margin-top:12px;display:flex;border:1px solid rgba(244,240,232,.6);border-radius:999px;overflow:hidden}
.lang button{min-width:48px;height:40px;border:0;background:transparent;color:#F4F0E8;font:700 14px Karla,sans-serif;cursor:pointer}
.lang button[aria-pressed="true"]{background:#F4F0E8;color:var(--ink)}
@media (max-width:480px){.btn{flex:1 1 100%}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<main>
  <img class="logo" src="/img/logo.png" alt="El Jardín de los Ángeles" width="88" height="88">
  <div class="eyebrow" data-t="eyebrow">Page not found · 404</div>
  <h1 data-t="h1">This path got lost in the garden</h1>
  <p data-t="p">The page you are looking for does not exist or has moved. Our rosaries, bracelets and Lourdes holy water are waiting for you in the shop.</p>
  <div class="ctas">
    <a class="btn btn-light" href="/#catalogo" data-t="shop">Go to the shop</a>
    <a class="btn btn-ghost" href="/" data-t="home">Home page</a>
  </div>
  <div class="lang" role="group" aria-label="Language / Idioma">
    <button type="button" data-lang="en" aria-pressed="true">EN</button><button type="button" data-lang="es" aria-pressed="false">ES</button>
  </div>
</main>
<script>
(function(){
  var T={
    en:{eyebrow:'Page not found · 404',h1:'This path got lost in the garden',p:'The page you are looking for does not exist or has moved. Our rosaries, bracelets and Lourdes holy water are waiting for you in the shop.',shop:'Go to the shop',home:'Home page',title:'Page not found · El Jardín de los Ángeles'},
    es:{eyebrow:'Página no encontrada · 404',h1:'Este camino se perdió en el jardín',p:'La página que buscas no existe o cambió de lugar. Nuestros rosarios, pulseras y agua bendita de Lourdes te esperan en la tienda.',shop:'Ir a la tienda',home:'Página principal',title:'Página no encontrada · El Jardín de los Ángeles'}
  };
  function set(l){
    l=(l==='es')?'es':'en'; document.documentElement.lang=l; document.title=T[l].title;
    [].forEach.call(document.querySelectorAll('[data-t]'),function(e){e.textContent=T[l][e.getAttribute('data-t')];});
    [].forEach.call(document.querySelectorAll('.lang button'),function(b){b.setAttribute('aria-pressed',String(b.getAttribute('data-lang')===l));});
    var q=l==='es'?'?lang=es':''; document.querySelector('[data-t="shop"]').href='/'+q+'#catalogo'; document.querySelector('[data-t="home"]').href='/'+q;
    return l;
  }
  var start='en'; try{var s=localStorage.getItem('lang'); if(s) start=s; else if((navigator.language||'').toLowerCase().indexOf('es')===0) start='es';}catch(e){}
  set(start);
  [].forEach.call(document.querySelectorAll('.lang button'),function(b){b.addEventListener('click',function(){var l=set(b.getAttribute('data-lang'));try{localStorage.setItem('lang',l);}catch(e){}});});
})();
</script>
</body>
</html>
