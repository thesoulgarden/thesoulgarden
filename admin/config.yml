            name: beneficios
            widget: object
            collapsed: true
            fields:
              - label: "Beneficio 1: título"
                name: v1b
                widget: object
                fields:
                  - { label: "Español", name: es, widget: string }
                  - { label: "Inglés", name: en, widget: string }
              - label: "Beneficio 1: detalle"
                name: v1s
                widget: object
                fields:
                  - { label: "Español", name: es, widget: string }
                  - { label: "Inglés", name: en, widget: string }
              - label: "Beneficio 2: título"
                name: v2b
                widget: object
                fields:
                  - { label: "Español", name: es, widget: string }
                  - { label: "Inglés", name: en, widget: string }
              - label: "Beneficio 2: detalle"
                name: v2s
                widget: object
                fields:
                  - { label: "Español", name: es, widget: string }
                  - { label: "Inglés", name: en, widget: string }
              - label: "Beneficio 3: título"
                name: v3b
                widget: object
                fields:
                  - { label: "Español", name: es, widget: string }
                  - { label: "Inglés", name: en, widget: string }
              - label: "Beneficio 3: detalle"
                name: v3s
                widget: object
