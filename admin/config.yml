# Panel de administración de El Jardín de los Ángeles
# Repositorio: github.com/thesoulgarden/thesoulgarden
backend:
  name: github
  repo: thesoulgarden/thesoulgarden
  branch: main
  commit_messages:
    update: "Actualizar {{collection}}: {{slug}}"

locale: es
site_url: https://thesoulgarden.netlify.app
display_url: https://thesoulgarden.netlify.app
logo_url: /img/logo.png

media_folder: img/productos
public_folder: /img/productos

collections:
  - name: catalogo
    label: Catálogo
    editor: { preview: false }
    files:
      - name: productos
        label: Productos
        file: data/products.json
        format: json
        fields:
          - label: Productos
            name: products
            widget: list
            label_singular: producto
            summary: "{{fields.name_es}} · ${{fields.price}} · {{fields.status}}"
            fields:
              - { label: "ID (número del artículo en Etsy o un código único)", name: id, widget: string, hint: "No lo cambies en productos existentes: el carrito lo usa." }
              - { label: "Nombre (español)", name: name_es, widget: string }
              - { label: "Nombre (inglés)", name: name_en, widget: string }
              - { label: "Descripción (español)", name: desc_es, widget: text }
              - { label: "Descripción (inglés)", name: desc_en, widget: text }
              - label: Categoría
                name: cat
                widget: select
                options:
                  - { label: Rosarios, value: rosarios }
                  - { label: Pulseras, value: pulseras }
                  - { label: Agua de Lourdes, value: agua }
                  - { label: Sets, value: sets }
                  - { label: Bolsos y accesorios, value: bolsos }
              - { label: "Precio (USD)", name: price, widget: number, value_type: float, min: 0, step: 0.5 }
              - label: Disponibilidad
                name: status
                widget: select
                default: disponible
                options:
                  - { label: "Disponible", value: disponible }
                  - { label: "Últimas unidades", value: ultimas }
                  - { label: "Agotado", value: agotado }
              - { label: "Mostrar etiqueta \"Nuevo\"", name: nuevo, widget: boolean, default: false, required: false }
              - { label: "Foto", name: img, widget: image, hint: "Foto cuadrada, idealmente de 800 a 1200 px." }
              - { label: "Enlace en Etsy (opcional)", name: etsy_url, widget: string, required: false }
              - label: "Opciones con precio distinto (opcional)"
                name: variants
                widget: list
                required: false
                summary: "{{fields.label_es}} · ${{fields.price}}"
                fields:
                  - { label: "Opción (español)", name: label_es, widget: string }
                  - { label: "Opción (inglés)", name: label_en, widget: string }
                  - { label: "Precio (USD)", name: price, widget: number, value_type: float, min: 0, step: 0.5 }

  - name: ofertas
    label: Ofertas
    editor: { preview: false }
    files:
      - name: campanas
        label: Campañas por temporada
        file: data/offers.json
        format: json
        fields:
          - label: Campañas
            name: campaigns
            widget: list
            label_singular: campaña
            summary: "{{fields.name_es}} · {{fields.discount}}% · activa: {{fields.active}}"
            fields:
              - { label: "ID (código único, sin espacios, ej.: navidad-2026)", name: id, widget: string }
              - { label: "Nombre (español)", name: name_es, widget: string }
              - { label: "Nombre (inglés)", name: name_en, widget: string }
              - { label: "Activar campaña", name: active, widget: boolean, default: false, hint: "Aunque esté activada, solo se aplica entre la fecha de inicio y la de fin." }
              - { label: "Inicio", name: start, widget: datetime, format: "YYYY-MM-DDTHH:mm", date_format: "DD/MM/YYYY", time_format: "HH:mm", picker_utc: false }
              - { label: "Fin", name: end, widget: datetime, format: "YYYY-MM-DDTHH:mm", date_format: "DD/MM/YYYY", time_format: "HH:mm", picker_utc: false }
              - { label: "Descuento (%)", name: discount, widget: number, value_type: int, min: 1, max: 90 }
              - label: "¿A qué se aplica?"
                name: applies_to
                widget: select
                default: all
                options:
                  - { label: "Toda la tienda", value: all }
                  - { label: "Una categoría", value: category }
                  - { label: "Productos que yo elija", value: products }
              - label: "Categoría (si elegiste 'Una categoría')"
                name: category
                widget: select
                required: false
                options:
                  - { label: Rosarios, value: rosarios }
                  - { label: Pulseras, value: pulseras }
                  - { label: Agua de Lourdes, value: agua }
                  - { label: Sets, value: sets }
                  - { label: Bolsos y accesorios, value: bolsos }
              - label: "Productos (si elegiste 'Productos que yo elija')"
                name: products
                widget: relation
                collection: catalogo
                file: productos
                value_field: "products.*.id"
                search_fields: ["products.*.name_es"]
                display_fields: ["products.*.name_es"]
                multiple: true
                required: false
              - { label: "Mensaje del anuncio (español)", name: banner_es, widget: string, required: false, hint: "Se muestra en la franja de arriba. Ej.: Navidad: 20% en sets de regalo" }
              - { label: "Mensaje del anuncio (inglés)", name: banner_en, widget: string, required: false }

  - name: textos
    label: Textos de la página
    editor: { preview: false }
    files:
      - name: textos
        label: Textos (español e inglés)
        file: data/texts.json
        format: json
        fields:
          - label: "Portada"
            name: portada
            widget: object
            collapsed: true
            fields:
              - label: "Texto pequeño de arriba"
                name: hero_eyebrow
                widget: object
                fields:
                  - { label: "Español", name: es, widget: string }
                  - { label: "Inglés", name: en, widget: string }
              - label: "Título principal"
                name: hero_h1
                widget: object
                fields:
                  - { label: "Español", name: es, widget: string }
                  - { label: "Inglés", name: en, widget: string }
              - label: "Descripción"
                name: hero_p
                widget: object
                fields:
                  - { label: "Español", name: es, widget: text }
                  - { label: "Inglés", name: en, widget: text }
              - label: "Botón 1"
                name: hero_cta1
                widget: object
                fields:
                  - { label: "Español", name: es, widget: string }
                  - { label: "Inglés", name: en, widget: string }
              - label: "Botón 2"
                name: hero_cta2
                widget: object
                fields:
                  - { label: "Español", name: es, widget: string }
                  - { label: "Inglés", name: en, widget: string }
          - label: "Franja de beneficios"
            name: beneficios
            widget: object
            collapsed: true
            fields:
              - label: "Beneficio 1: título"
                name: v1b
                widget: object
                fields:
                  - { label: "Español", name: es, widget: string }
                  - { label: "Inglés", name: en, widget: string }
              - label: "Beneficio 1: detalle"
                name: v1s
                widget: object
                fields:
                  - { label: "Español", name: es, widget: string }
                  - { label: "Inglés", name: en, widget: string }
              - label: "Beneficio 2: título"
                name: v2b
                widget: object
                fields:
                  - { label: "Español", name: es, widget: string }
                  - { label: "Inglés", name: en, widget: string }
              - label: "Beneficio 2: detalle"
                name: v2s
                widget: object
                fields:
                  - { label: "Español", name: es, widget: string }
                  - { label: "Inglés", name: en, widget: string }
              - label: "Beneficio 3: título"
                name: v3b
                widget: object
                fields:
                  - { label: "Español", name: es, widget: string }
                  - { label: "Inglés", name: en, widget: string }
              - label: "Beneficio 3: detalle"
                name: v3s
                widget: object
                fields:
                  - { label: "Español", name: es, widget: string }
                  - { label: "Inglés", name: en, widget: string }
          - label: "Colección"
            name: coleccion
            widget: object
            collapsed: true
            fields:
              - label: "Texto pequeño"
                name: cat_eyebrow
                widget: object
                fields:
                  - { label: "Español", name: es, widget: string }
                  - { label: "Inglés", name: en, widget: string }
              - label: "Título"
                name: cat_h2
                widget: object
                fields:
                  - { label: "Español", name: es, widget: string }
                  - { label: "Inglés", name: en, widget: string }
              - label: "Enlace a Etsy al final"
                name: see_all
                widget: object
                fields:
                  - { label: "Español", name: es, widget: string }
                  - { label: "Inglés", name: en, widget: string }
          - label: "Set destacado"
            name: set_destacado
            widget: object
            collapsed: true
            fields:
              - label: "Texto pequeño"
                name: kit_eyebrow
                widget: object
                fields:
                  - { label: "Español", name: es, widget: string }
                  - { label: "Inglés", name: en, widget: string }
              - label: "Título"
                name: kit_h2
                widget: object
                fields:
                  - { label: "Español", name: es, widget: string }
                  - { label: "Inglés", name: en, widget: string }
              - label: "Descripción"
                name: kit_p
                widget: object
                fields:
                  - { label: "Español", name: es, widget: text }
                  - { label: "Inglés", name: en, widget: text }
              - label: "Texto del botón"
                name: kit_cta
                widget: object
                fields:
                  - { label: "Español", name: es, widget: string }
                  - { label: "Inglés", name: en, widget: string }
              - { label: "Precio que se muestra (ej.: $115)", name: kit_price, widget: string }
              - { label: "Enlace a Etsy (solo si el producto de abajo no existe)", name: kit_url, widget: string, required: false }
              - { label: "ID del producto del set destacado", name: kit_product_id, widget: string, required: false, hint: "El ID del producto en Catálogo (ej.: 4479161090). El botón abrirá ese producto en la página con su precio y botón de compra." }
              - label: "Texto del botón (abre el producto en la página)"
                name: kit_cta_shop
                widget: object
                required: false
                fields:
                  - { label: "Español", name: es, widget: string, required: false }
                  - { label: "Inglés", name: en, widget: string, required: false }
          - label: "Reseñas"
            name: resenas
            widget: object
            collapsed: true
            fields:
              - label: "Texto pequeño"
                name: rev_eyebrow
                widget: object
                fields:
                  - { label: "Español", name: es, widget: string }
                  - { label: "Inglés", name: en, widget: string }
              - label: "Título"
                name: rev_h2
                widget: object
                fields:
                  - { label: "Español", name: es, widget: string }
                  - { label: "Inglés", name: en, widget: string }
              - label: "Enlace a todas las reseñas"
                name: rev_all
                widget: object
                fields:
                  - { label: "Español", name: es, widget: string }
                  - { label: "Inglés", name: en, widget: string }
          - label: "Cómo comprar"
            name: como_comprar
            widget: object
            collapsed: true
            fields:
              - label: "Título"
                name: how_h2
                widget: object
                fields:
                  - { label: "Español", name: es, widget: string }
                  - { label: "Inglés", name: en, widget: string }
              - label: "Paso 1: título"
                name: s1h
                widget: object
                fields:
                  - { label: "Español", name: es, widget: string }
                  - { label: "Inglés", name: en, widget: string }
              - label: "Paso 1: texto"
                name: s1p
                widget: object
                fields:
                  - { label: "Español", name: es, widget: text }
                  - { label: "Inglés", name: en, widget: text }
              - label: "Paso 2: título"
                name: s2h
                widget: object
                fields:
                  - { label: "Español", name: es, widget: string }
                  - { label: "Inglés", name: en, widget: string }
              - label: "Paso 2: texto"
                name: s2p
                widget: object
                fields:
                  - { label: "Español", name: es, widget: text }
                  - { label: "Inglés", name: en, widget: text }
              - label: "Paso 3: título"
                name: s3h
                widget: object
                fields:
                  - { label: "Español", name: es, widget: string }
                  - { label: "Inglés", name: en, widget: string }
              - label: "Paso 3: texto"
                name: s3p
                widget: object
                fields:
                  - { label: "Español", name: es, widget: text }
                  - { label: "Inglés", name: en, widget: text }
          - label: "Preguntas frecuentes"
            name: preguntas
            widget: object
            collapsed: true
            fields:
              - label: "Título"
                name: faq_h2
                widget: object
                fields:
                  - { label: "Español", name: es, widget: string }
                  - { label: "Inglés", name: en, widget: string }
              - label: "Pregunta 1"
                name: q1
                widget: object
                fields:
                  - { label: "Español", name: es, widget: string }
                  - { label: "Inglés", name: en, widget: string }
              - label: "Respuesta 1"
                name: a1
                widget: object
                fields:
                  - { label: "Español", name: es, widget: text }
                  - { label: "Inglés", name: en, widget: text }
              - label: "Pregunta 2"
                name: q2
                widget: object
                fields:
                  - { label: "Español", name: es, widget: string }
                  - { label: "Inglés", name: en, widget: string }
              - label: "Respuesta 2"
                name: a2
                widget: object
                fields:
                  - { label: "Español", name: es, widget: text }
                  - { label: "Inglés", name: en, widget: text }
              - label: "Pregunta 3"
                name: q3
                widget: object
                fields:
                  - { label: "Español", name: es, widget: string }
                  - { label: "Inglés", name: en, widget: string }
              - label: "Respuesta 3"
                name: a3
                widget: object
                fields:
                  - { label: "Español", name: es, widget: text }
                  - { label: "Inglés", name: en, widget: text }
              - label: "Pregunta 4"
                name: q4
                widget: object
                fields:
                  - { label: "Español", name: es, widget: string }
                  - { label: "Inglés", name: en, widget: string }
              - label: "Respuesta 4"
                name: a4
                widget: object
                fields:
                  - { label: "Español", name: es, widget: text }
                  - { label: "Inglés", name: en, widget: text }
          - label: "Sección de Instagram"
            name: instagram
            widget: object
            collapsed: true
            fields:
              - label: "Título"
                name: ig_h2
                widget: object
                fields:
                  - { label: "Español", name: es, widget: string }
                  - { label: "Inglés", name: en, widget: string }
              - label: "Texto"
                name: ig_p
                widget: object
                fields:
                  - { label: "Español", name: es, widget: text }
                  - { label: "Inglés", name: en, widget: text }
          - label: "Pie de página"
            name: pie
            widget: object
            collapsed: true
            fields:
              - label: "Descripción de la tienda"
                name: foot_p
                widget: object
                fields:
                  - { label: "Español", name: es, widget: text }
                  - { label: "Inglés", name: en, widget: text }

  - name: ajustes
    label: Ajustes
    editor: { preview: false }
    files:
      - name: tienda
        label: Datos de contacto
        file: data/settings.json
        format: json
        fields:
          - { label: "WhatsApp (con código de país, ej.: +19294133312)", name: whatsapp, widget: string, required: false }
          - { label: "Costo de envío en EE. UU. (USD, 0 = gratis)", name: shipping_cost, widget: number, value_type: float, min: 0, step: 0.5, default: 5, required: false }
          - { label: "Código de GoatCounter (estadísticas)", name: goatcounter, widget: string, required: false, hint: "Solo el código, por ejemplo thesoulgarden (de thesoulgarden.goatcounter.com). Déjalo vacío para desactivar." }
          - { label: "Enlace a la hoja de inventario (Google Sheets)", name: inventory_url, widget: string, required: false, hint: "Pega el enlace de tu Google Sheet. Aparece en el Tablero. Mantén la hoja compartida solo contigo y la dueña." }
